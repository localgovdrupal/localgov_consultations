services:
  localgov_consultations.commands:
    class: \Drupal\localgov_consultations_notify\Commands\consultationEmail
    tags:
      - { name: drush.command }
  localgov_consultations_notify.notifier:
    class: Drupal\localgov_consultations_notify\Notifier
    arguments: ['@queue', '@config.factory', '@state', '@entity_type.manager', '@url_generator']
  localgov_consultations_notify.subscription_handler:
    class: Drupal\localgov_consultations_notify\SubscriptionHandler
    arguments: ['@email_factory', '@url_generator']
